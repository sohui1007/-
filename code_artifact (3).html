<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중학생 벽돌깨기 게임</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent default touch gestures like pinch-zoom on mobile/touch screens */
        }
        canvas {
            background: linear-gradient(to bottom, #1e1b4b, #312e81);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4">

    <header class="w-full max-w-4xl flex flex-col sm:flex-row justify-between items-center bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow-lg mb-2 gap-4">
        <h1 class="text-2xl sm:text-3xl font-black text-yellow-400 tracking-wide flex items-center gap-2">
            🧱 파워 벽돌깨기
        </h1>
        <div class="flex flex-wrap gap-4 text-lg sm:text-xl font-bold">
            <div class="bg-slate-900 px-4 py-2 rounded-xl border border-slate-700 flex items-center gap-2">
                <span class="text-slate-400 text-base">점수:</span>
                <span id="scoreDisplay" class="text-green-400">0</span>
            </div>
            <div class="bg-slate-900 px-4 py-2 rounded-xl border border-slate-700 flex items-center gap-2">
                <span class="text-slate-400 text-base">생명:</span>
                <span id="livesDisplay" class="text-red-400">❤️❤️❤️</span>
            </div>
            <div class="bg-slate-900 px-4 py-2 rounded-xl border border-slate-700 flex items-center gap-2">
                <span class="text-slate-400 text-base">단계:</span>
                <span id="levelDisplay" class="text-cyan-400">1 / 3</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-4xl flex flex-col items-center flex-grow justify-center relative">
        <!-- Game Canvas -->
        <div class="relative w-full aspect-[4/3] max-w-[800px] max-h-[600px] rounded-2xl overflow-hidden border-4 border-slate-700">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>
            
            <!-- Message Overlay (Start / Game Over / Victory / Pause) -->
            <div id="overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center transition-all duration-300">
                <h2 id="overlayTitle" class="text-3xl sm:text-5xl font-extrabold text-yellow-400 mb-4 drop-shadow-lg">벽돌깨기 게임</h2>
                <p id="overlayDesc" class="text-lg sm:text-2xl text-slate-200 mb-8 max-w-lg leading-relaxed">
                    스페이스바 또는 시작 버튼을 눌러 게임을 시작하세요!<br>
                    <span class="text-sm sm:text-base text-slate-400 mt-2 block">←/→ 키 또는 마우스/터치로 패들 이동, 스페이스바로 공 발사 및 일시정지</span>
                </p>
                <div class="flex flex-wrap gap-4 justify-center">
                    <button id="actionBtn" class="px-8 py-4 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-black text-xl rounded-2xl shadow-xl transition transform hover:scale-105 active:scale-95">
                        게임 시작
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-4xl flex flex-wrap justify-center gap-4 mt-4">
        <button id="startBtnFooter" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 font-bold text-lg rounded-xl shadow-md transition">
            시작 / 일시정지 (Space)
        </button>
        <button id="nextBtnFooter" class="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 font-bold text-lg rounded-xl shadow-md transition hidden">
            다음 단계
        </button>
        <button id="restartBtnFooter" class="px-6 py-3 bg-rose-600 hover:bg-rose-500 font-bold text-lg rounded-xl shadow-md transition">
            다시 하기
        </button>
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI elements
        const scoreDisplay = document.getElementById('scoreDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayDesc = document.getElementById('overlayDesc');
        const actionBtn = document.getElementById('actionBtn');
        const startBtnFooter = document.getElementById('startBtnFooter');
        const nextBtnFooter = document.getElementById('nextBtnFooter');
        const restartBtnFooter = document.getElementById('restartBtnFooter');

        // Logical canvas internal dimensions for stable physics across devices
        const LOGICAL_WIDTH = 800;
        const LOGICAL_HEIGHT = 600;
        canvas.width = LOGICAL_WIDTH;
        canvas.height = LOGICAL_HEIGHT;

        // Game State Variables
        let score = 0;
        let lives = 3;
        let level = 1;
        let gameState = 'READY'; // READY, PLAYING, PAUSED, GAMEOVER, LEVELCLEAR, VICTORY

        // Paddle Configuration
        const paddleWidth = 120;
        const paddleHeight = 18;
        let paddleX = (LOGICAL_WIDTH - paddleWidth) / 2;
        const paddleY = LOGICAL_HEIGHT - 40;
        let rightPressed = false;
        let leftPressed = false;
        let mouseX = null;

        // Ball Configuration
        let ballRadius = 10;
        let ballX = LOGICAL_WIDTH / 2;
        let ballY = paddleY - ballRadius;
        let ballDX = 0;
        let ballDY = 0;
        let isBallAttached = true;

        // Brick Configuration
        let brickRowCount = 4;
        let brickColumnCount = 8;
        let brickWidth = 85;
        let brickHeight = 25;
        let brickPadding = 12;
        let brickOffsetTop = 60;
        let brickOffsetLeft = 45;
        let bricks = [];

        // Initialize brick layout based on level
        function initBricks() {
            // Adjust rows/cols or properties depending on level
            brickRowCount = 3 + level; // Level 1: 4 rows, Level 2: 5 rows, Level 3: 6 rows
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    // Different colors per row
                    let colors = ['#f43f5e', '#fb923c', '#facc15', '#4ade80', '#38bdf8', '#c084fc'];
                    bricks[c][r] = { 
                        x: 0, 
                        y: 0, 
                        status: 1, 
                        color: colors[r % colors.length] 
                    };
                }
            }
        }

        // Reset game state to initial values
        function resetGame() {
            score = 0;
            lives = 3;
            level = 1;
            loadLevel();
        }

        // Load specific level
        function loadLevel() {
            isBallAttached = true;
            ballDX = 0;
            ballDY = 0;
            paddleX = (LOGICAL_WIDTH - paddleWidth) / 2;
            ballX = paddleX + paddleWidth / 2;
            ballY = paddleY - ballRadius;
            initBricks();
            updateUI();
            setGameState('READY');
        }

        // Update HTML UI elements
        function updateUI() {
            scoreDisplay.textContent = score;
            livesDisplay.textContent = '❤️'.repeat(Math.max(0, lives));
            levelDisplay.textContent = `${level} / 3`;
        }

        // Control game states and overlay presentations
        function setGameState(newState) {
            gameState = newState;
            if (gameState === 'READY') {
                overlay.classList.remove('hidden');
                overlayTitle.textContent = `${level}단계 시작 대기`;
                overlayDesc.innerHTML = `스페이스바 또는 시작 버튼을 누르면 공이 발사됩니다!<br><span class="text-sm text-yellow-300 mt-2 block">현재 단계 공 속도 적용됨 (단계 ${level})</span>`;
                actionBtn.textContent = '공 발사하기';
                nextBtnFooter.classList.add('hidden');
            } else if (gameState === 'PLAYING') {
                overlay.classList.add('hidden');
                nextBtnFooter.classList.add('hidden');
            } else if (gameState === 'PAUSED') {
                overlay.classList.remove('hidden');
                overlayTitle.textContent = '일시 정지';
                overlayDesc.textContent = '게임을 다시 시작하려면 스페이스바를 누르세요.';
                actionBtn.textContent = '계속하기';
            } else if (gameState === 'GAMEOVER') {
                overlay.classList.remove('hidden');
                overlayTitle.textContent = '게임 끝';
                overlayDesc.innerHTML = `아쉽네요! 생명이 모두 소모되었습니다.<br>최종 점수: <span class="text-yellow-400 font-bold">${score}점</span>`;
                actionBtn.textContent = '다시 하기';
            } else if (gameState === 'LEVELCLEAR') {
                overlay.classList.remove('hidden');
                overlayTitle.textContent = `${level}단계 클리어!`;
                overlayDesc.innerHTML = `훌륭합니다! 모든 벽돌을 부셨습니다.<br>다음 단계로 진행하세요.`;
                actionBtn.textContent = '다음 단계로';
                nextBtnFooter.classList.remove('hidden');
            } else if (gameState === 'VICTORY') {
                overlay.classList.remove('hidden');
                overlayTitle.textContent = '모든 단계 완료!';
                overlayDesc.innerHTML = `축하합니다! 3단계를 모두 클리어했습니다! 🏆<br>최종 점수: <span class="text-yellow-400 font-bold">${score}점</span>`;
                actionBtn.textContent = '처음부터 다시';
            }
        }

        // Launch ball based on level speed
        function launchBall() {
            if (isBallAttached && gameState === 'PLAYING') {
                isBallAttached = false;
                // Speed increases per level: Level 1 = 5, Level 2 = 6.5, Level 3 = 8
                let speed = 4.5 + (level * 1.5);
                // Randomize initial launch angle slightly
                let angle = (Math.random() * 0.6 - 0.3) * Math.PI; 
                ballDX = speed * Math.sin(angle);
                ballDY = -speed * Math.cos(angle);
            }
        }

        // Input Event Listeners
        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                rightPressed = true;
            } else if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                leftPressed = true;
            } else if (e.code === 'Space') {
                e.preventDefault();
                handlePrimaryAction();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                rightPressed = false;
            } else if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                leftPressed = false;
            }
        });

        // Mouse & Touch movement tracking
        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width;
            mouseX = (e.clientX - rect.left) * scaleX;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            let rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width;
            if (e.touches.length > 0) {
                mouseX = (e.touches[0].clientX - rect.left) * scaleX;
            }
        }, { passive: false });

        // Primary action handler for buttons & spacebar
        function handlePrimaryAction() {
            if (gameState === 'READY') {
                setGameState('PLAYING');
                launchBall();
            } else if (gameState === 'PLAYING') {
                setGameState('PAUSED');
            } else if (gameState === 'PAUSED') {
                setGameState('PLAYING');
            } else if (gameState === 'GAMEOVER' || gameState === 'VICTORY') {
                resetGame();
                setGameState('READY');
            } else if (gameState === 'LEVELCLEAR') {
                if (level < 3) {
                    level++;
                    loadLevel();
                    setGameState('READY');
                } else {
                    setGameState('VICTORY');
                }
            }
        }

        actionBtn.addEventListener('click', handlePrimaryAction);
        startBtnFooter.addEventListener('click', () => {
            if (gameState === 'READY') {
                setGameState('PLAYING');
                launchBall();
            } else {
                handlePrimaryAction();
            }
        });
        nextBtnFooter.addEventListener('click', () => {
            if (gameState === 'LEVELCLEAR') {
                if (level < 3) {
                    level++;
                    loadLevel();
                    setGameState('READY');
                } else {
                    setGameState('VICTORY');
                }
            }
        });
        restartBtnFooter.addEventListener('click', () => {
            resetGame();
            setGameState('READY');
        });

        // Collision Detection with Bricks
        function collisionDetection() {
            let allBricksCleared = true;
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        allBricksCleared = false;
                        let brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        let brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        b.x = brickX;
                        b.y = brickY;

                        // Check ball intersection with brick bounds
                        if (
                            ballX + ballRadius > brickX &&
                            ballX - ballRadius < brickX + brickWidth &&
                            ballY + ballRadius > brickY &&
                            ballY - ballRadius < brickY + brickHeight
                        ) {
                            ballDY = -ballDY;
                            b.status = 0;
                            score += 10;
                            updateUI();

                            // Check if all bricks cleared in this level
                            checkLevelCompletion();
                        }
                    }
                }
            }
            return allBricksCleared;
        }

        function checkLevelCompletion() {
            let cleared = true;
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        cleared = false;
                        break;
                    }
                }
                if (!cleared) break;
            }

            if (cleared) {
                if (level < 3) {
                    setGameState('LEVELCLEAR');
                } else {
                    setGameState('VICTORY');
                }
            }
        }

        // Draw game elements on canvas
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Bricks
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        let brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        let brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;

                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 6);
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.fill();
                        ctx.strokeStyle = '#0f172a';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        ctx.closePath();
                    }
                }
            }

            // Draw Paddle
            ctx.beginPath();
            ctx.roundRect(paddleX, paddleY, paddleWidth, paddleHeight, 10);
            ctx.fillStyle = '#38bdf8';
            ctx.fill();
            ctx.strokeStyle = '#0284c7';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();

            // Draw Ball
            ctx.beginPath();
            ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#facc15';
            ctx.fill();
            ctx.strokeStyle = '#ca8a04';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();
        }

        // Main Update Loop
        function update() {
            if (gameState === 'PLAYING') {
                // Paddle movement logic (Keyboard or Mouse/Touch)
                if (mouseX !== null) {
                    paddleX = mouseX - paddleWidth / 2;
                    mouseX = null; // reset until next move event
                } else if (rightPressed) {
                    paddleX += 8;
                } else if (leftPressed) {
                    paddleX -= 8;
                }

                // Keep paddle inside canvas boundaries
                if (paddleX < 0) {
                    paddleX = 0;
                } else if (paddleX + paddleWidth > LOGICAL_WIDTH) {
                    paddleX = LOGICAL_WIDTH - paddleWidth;
                }

                // If ball is attached to paddle before launch
                if (isBallAttached) {
                    ballX = paddleX + paddleWidth / 2;
                    ballY = paddleY - ballRadius;
                } else {
                    // Move ball
                    ballX += ballDX;
                    ballY += ballDY;

                    // Wall collision (Left / Right)
                    if (ballX + ballRadius > LOGICAL_WIDTH) {
                        ballX = LOGICAL_WIDTH - ballRadius;
                        ballDX = -ballDX;
                    } else if (ballX - ballRadius < 0) {
                        ballX = ballRadius;
                        ballDX = -ballDX;
                    }

                    // Wall collision (Top)
                    if (ballY - ballRadius < 0) {
                        ballY = ballRadius;
                        ballDY = -ballDY;
                    }

                    // Paddle collision
                    if (
                        ballY + ballRadius >= paddleY &&
                        ballY - ballRadius <= paddleY + paddleHeight &&
                        ballX >= paddleX &&
                        ballX <= paddleX + paddleWidth
                    ) {
                        // Calculate bounce angle based on where it hit the paddle
                        let hitPoint = ballX - (paddleX + paddleWidth / 2);
                        let normalizedHitPoint = hitPoint / (paddleWidth / 2);
                        let bounceAngle = normalizedHitPoint * (Math.PI / 3); // Max 60 degrees

                        let currentSpeed = Math.sqrt(ballDX * ballDX + ballDY * ballDY);
                        ballDX = currentSpeed * Math.sin(bounceAngle);
                        ballDY = -currentSpeed * Math.cos(bounceAngle);
                        
                        // Ensure minimum upward velocity
                        if (Math.abs(ballDY) < 2) {
                            ballDY = ballDY < 0 ? -2 : 2;
                        }
                    }

                    // Bottom collision (Lose Life)
                    if (ballY - ballRadius > LOGICAL_HEIGHT) {
                        lives--;
                        updateUI();
                        if (lives <= 0) {
                            setGameState('GAMEOVER');
                        } else {
                            // Reset ball on paddle
                            isBallAttached = true;
                            ballDX = 0;
                            ballDY = 0;
                            ballX = paddleX + paddleWidth / 2;
                            ballY = paddleY - ballRadius;
                            setGameState('READY');
                        }
                    }

                    // Brick collision
                    collisionDetection();
                }
            }
        }

        // Game Loop Frame Rate Controller
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initialization on Load
        window.onload = function() {
            resetGame();
            gameLoop();
        };
    </script>
</body>
</html>
